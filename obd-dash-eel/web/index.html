<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PiZero OBD (Eel)</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="/eel.js"></script>
</head>
<body class="theme-cockpit">
  <div id="device">
    <header id="topbar">
      <span id="title">PiZero&nbsp;&nbsp;OBD</span>
      <span class="spacer"></span>
      <select id="designSelect" title="Design"></select>
      <span id="link" class="pill">BT LINK</span>
      <span id="clock">--:--</span>
    </header>

    <main id="stage" class="layout-cockpit"></main>

    <footer id="botbar">
      <span id="vehicle">--</span>
      <span id="vin">VIN --</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
